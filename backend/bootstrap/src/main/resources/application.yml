spring:
  application:
    name: micasachurch-bootstrap
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:micasachurch}
    username: ${DB_USER:micasachurch}
    password: ${DB_PASSWORD:micasachurch}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8088}

logging:
  pattern:
    level: "%5p [req=%X{requestId:--} usr=%X{userId:--}]"

spring.servlet.multipart:
  max-file-size: 5MB
  max-request-size: 5MB

app:
  uploads-dir: ${UPLOADS_DIR:uploads}
  admin-public-url: ${ADMIN_PUBLIC_URL:http://admin.micasachurch.test}

contact:
  api:
    base-url: ${CONTACT_API_URL:http://localhost:3000}

security:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-dev-secret-change-me}
    ttl-minutes: ${JWT_TTL_MINUTES:720}

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://micasachurch.test,http://admin.micasachurch.test}
