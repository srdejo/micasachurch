<h1 class="text-2xl font-serif mb-2">Contenido</h1>
<p class="text-ink-muted text-sm mb-6">Textos del sitio público y los ministerios que se muestran en la sección "Ministerios".</p>

<div class="rounded-card bg-card border border-ink/10 p-6 mb-8">
  <p class="font-semibold mb-4">Textos</p>
  <div class="space-y-5">
    @for (item of siteContent(); track item.id) {
      <div>
        <label class="block text-xs text-ink-muted mb-1">{{ item.label }}</label>
        <textarea [(ngModel)]="item.value" rows="3"
          class="w-full rounded-card border border-ink/15 px-3 py-2 text-sm"></textarea>
        <button (click)="saveContent(item)" class="mt-2 rounded-pill bg-ink text-cream text-sm px-4 py-1.5">Guardar</button>
      </div>
    }
  </div>
</div>

<div class="rounded-card bg-card border border-ink/10 p-6">
  <div class="flex items-center justify-between mb-4">
    <p class="font-semibold">Ministerios</p>
    <button (click)="addMinistry()" class="rounded-pill bg-terracotta text-cream text-sm px-4 py-2">Agregar ministerio</button>
  </div>
  <div class="grid md:grid-cols-2 gap-4">
    @for (m of ministries(); track m.id) {
      <div class="rounded-card border border-ink/10 p-4">
        <label class="block text-xs text-ink-muted mb-1">Nombre</label>
        <input [(ngModel)]="m.name" class="w-full rounded-card border border-ink/15 px-3 py-2 text-sm mb-3" />
        <label class="block text-xs text-ink-muted mb-1">Descripción</label>
        <textarea [(ngModel)]="m.description" rows="2" class="w-full rounded-card border border-ink/15 px-3 py-2 text-sm mb-3"></textarea>
        <div class="flex items-center justify-between">
          <button (click)="saveMinistry(m)" class="rounded-pill bg-ink text-cream text-sm px-4 py-1.5">Guardar</button>
          <button (click)="deleteMinistry(m)" class="text-terracotta text-sm hover:underline">Eliminar</button>
        </div>
      </div>
    }
  </div>
</div>
