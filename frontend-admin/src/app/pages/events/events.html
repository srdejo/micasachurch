<div class="flex items-center justify-between mb-6">
  <h1 class="text-2xl font-serif">Eventos</h1>
  <button (click)="addNew()" class="rounded-pill bg-terracotta hover:bg-terracotta-hover text-cream text-sm font-medium px-5 py-2.5">
    Nuevo evento
  </button>
</div>

<div class="space-y-4">
  @for (event of events(); track event.id) {
    <div class="rounded-card bg-card border border-ink/10 p-5 grid md:grid-cols-[80px_100px_1fr_1fr_auto_auto] gap-3 items-start">
      <input [(ngModel)]="event.day" placeholder="Día" class="rounded-card border border-ink/15 px-3 py-2 text-sm" />
      <input [(ngModel)]="event.month" placeholder="Mes" class="rounded-card border border-ink/15 px-3 py-2 text-sm" />
      <input [(ngModel)]="event.title" placeholder="Título" class="rounded-card border border-ink/15 px-3 py-2 text-sm" />
      <input [(ngModel)]="event.detail" placeholder="Detalle" class="rounded-card border border-ink/15 px-3 py-2 text-sm" />
      <label class="flex items-center gap-2 text-sm px-2 py-2">
        <input type="checkbox" [(ngModel)]="event.published" />
        Publicado
      </label>
      <div class="flex gap-2">
        <button (click)="save(event)" class="rounded-pill bg-ink text-cream text-sm px-4 py-2">Guardar</button>
        <button (click)="remove(event.id)" class="rounded-pill border border-terracotta text-terracotta text-sm px-4 py-2">Eliminar</button>
      </div>
    </div>
  } @empty {
    <p class="text-ink-muted text-sm">No hay eventos todavía.</p>
  }
</div>
