<div class="flex flex-wrap items-end justify-between gap-4 mb-7">
  <div class="flex flex-col gap-1">
    <h1 class="font-serif text-[40px] leading-none">Redes</h1>
    <span class="text-[15px] text-ink-muted">Grupos pequeños que se muestran en la sección "Redes"</span>
  </div>
  <button (click)="add()" class="rounded-pill bg-terracotta hover:bg-terracotta-hover text-cream text-sm font-semibold px-5 py-2.5">Agregar red</button>
</div>

<div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
  @for (n of networks(); track n.id) {
    <div class="rounded-card bg-card border border-ink/[0.14] p-5">
      <label class="block text-xs text-ink-muted mb-1">Nombre</label>
      <input [(ngModel)]="n.name" class="w-full rounded-card border border-ink/15 px-3 py-2 text-sm mb-3" />
      <label class="block text-xs text-ink-muted mb-1">Descripción</label>
      <textarea [(ngModel)]="n.description" rows="3" class="w-full rounded-card border border-ink/15 px-3 py-2 text-sm mb-3"></textarea>
      <label class="block text-xs text-ink-muted mb-1">Líder / contacto</label>
      <input [(ngModel)]="n.leadContact" class="w-full rounded-card border border-ink/15 px-3 py-2 text-sm mb-3" />
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <button (click)="save(n)" [disabled]="status()[n.id] === 'saving'"
            class="rounded-pill bg-ink text-cream text-sm px-4 py-2 disabled:opacity-60">
            {{ status()[n.id] === 'saving' ? 'Guardando...' : 'Guardar' }}
          </button>
          @if (status()[n.id] === 'saved') {
            <span class="text-terracotta text-sm font-medium">Guardado ✓</span>
          }
          @if (status()[n.id] === 'error') {
            <span class="text-terracotta text-sm font-medium">Error al guardar</span>
          }
        </div>
        <button (click)="remove(n)" class="text-terracotta text-sm hover:underline">Eliminar</button>
      </div>
    </div>
  }
</div>
