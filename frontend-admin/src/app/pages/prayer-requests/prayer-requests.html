<h1 class="text-2xl font-serif mb-6">Peticiones de oración</h1>

<div class="space-y-3">
  @for (r of requests(); track r.id) {
    <div class="rounded-card bg-card border border-ink/10 p-5 flex items-start justify-between gap-4"
         [class.opacity-60]="r.read">
      <div>
        <p class="font-semibold">{{ r.name || 'Anónimo' }}</p>
        <p class="text-xs text-ink-muted mb-2">{{ r.createdAt | date: 'medium' }}</p>
        <p class="text-ink-soft text-sm">{{ r.message }}</p>
      </div>
      <div class="flex flex-col items-end gap-2 shrink-0">
        @if (r.phone) {
          <a [href]="whatsappLink(r.phone)" target="_blank" rel="noopener" class="text-sm text-terracotta hover:underline">WhatsApp</a>
        }
        @if (!r.read) {
          <button (click)="markRead(r.id)" class="rounded-pill bg-ink text-cream text-sm px-4 py-2">Marcar como atendida</button>
        } @else {
          <span class="text-xs text-ink-muted">Atendida</span>
        }
      </div>
    </div>
  } @empty {
    <p class="text-ink-muted text-sm">No hay peticiones todavía.</p>
  }
</div>
