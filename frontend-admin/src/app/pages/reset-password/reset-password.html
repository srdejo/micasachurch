<div class="min-h-screen flex items-center justify-center bg-surface px-6">
  <div class="w-full max-w-sm rounded-card bg-card border border-ink/[0.14] p-8 shadow-sm">
    <div class="text-center mb-8">
      @if (!logoFailed()) {
        <img [src]="logoUrl()" (error)="logoFailed.set(true)" alt="Mi Casa Church"
          class="inline-block h-12 w-12 rounded-full object-cover mb-3" />
      } @else {
        <span class="inline-flex h-12 w-12 rounded-full bg-terracotta text-cream items-center justify-center font-serif text-xl mb-3">M</span>
      }
      <h1 class="text-2xl font-serif">Nueva clave</h1>
      <p class="text-ink-muted text-sm">Elige la clave para tu cuenta del panel</p>
    </div>

    @if (done()) {
      <p class="text-sm text-ink-soft text-center mb-5">Tu clave quedó actualizada.</p>
      <a routerLink="/login"
        class="block text-center w-full rounded-pill bg-terracotta hover:bg-terracotta-hover text-cream font-medium py-3 transition-colors">
        Ir a iniciar sesión
      </a>
    } @else {
      <form (ngSubmit)="submit()" class="space-y-4">
        <input [ngModel]="newPassword()" (ngModelChange)="newPassword.set($event)" name="newPassword" type="password"
          placeholder="Clave nueva (mínimo 8 caracteres)"
          class="w-full rounded-card border border-ink/15 px-4 py-3 outline-none focus:border-terracotta" />
        <input [ngModel]="confirmPassword()" (ngModelChange)="confirmPassword.set($event)" name="confirmPassword" type="password"
          placeholder="Confirma la clave"
          class="w-full rounded-card border border-ink/15 px-4 py-3 outline-none focus:border-terracotta" />
        @if (error()) {
          <p class="text-terracotta text-sm">{{ error() }}</p>
        }
        <button type="submit" [disabled]="loading()"
          class="w-full rounded-pill bg-terracotta hover:bg-terracotta-hover disabled:opacity-60 text-cream font-medium py-3 transition-colors">
          {{ loading() ? 'Guardando...' : 'Guardar clave' }}
        </button>
      </form>
    }

    <div class="text-center mt-5">
      <a routerLink="/login" class="text-sm text-ink-muted hover:text-terracotta">Volver a iniciar sesión</a>
    </div>
  </div>
</div>
