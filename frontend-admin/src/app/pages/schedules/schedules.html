<div class="flex flex-col gap-1 mb-7">
  <h1 class="font-serif text-[40px] leading-none">Horarios y en vivo</h1>
  <span class="text-[15px] text-ink-muted">Servicios y franja de transmisión</span>
</div>

<div class="rounded-card bg-sidebar text-cream p-6 mb-8 flex items-center justify-between">
  <div>
    <p class="font-semibold">Banner "En vivo"</p>
    <p class="text-ink-muted text-sm">Muestra el aviso de transmisión diaria en la landing.</p>
  </div>
  <button (click)="toggleBanner()"
    class="rounded-pill text-sm font-medium px-5 py-2.5"
    [class.bg-terracotta]="siteSettings().liveBannerVisible"
    [class.text-cream]="siteSettings().liveBannerVisible"
    [class.border]="!siteSettings().liveBannerVisible"
    [class.border-ink]="!siteSettings().liveBannerVisible">
    {{ siteSettings().liveBannerVisible ? 'Visible' : 'Oculto' }}
  </button>
</div>

<div class="grid md:grid-cols-2 gap-4">
  @for (s of schedules(); track s.id) {
    <div class="rounded-card bg-card border border-ink/10 p-5">
      <p class="font-semibold mb-3">{{ s.day }}</p>
      <label class="block text-xs text-ink-muted mb-1">Hora</label>
      <input [(ngModel)]="s.time" class="w-full rounded-card border border-ink/15 px-3 py-2 text-sm mb-3" />
      <label class="block text-xs text-ink-muted mb-1">Nota</label>
      <input [(ngModel)]="s.note" class="w-full rounded-card border border-ink/15 px-3 py-2 text-sm mb-3" />
      <label class="flex items-center gap-2 text-sm mb-3 cursor-pointer">
        <input type="checkbox" [checked]="s.streamed" (change)="toggleStreamed(s)" class="rounded border-ink/30" />
        Este servicio se transmite en vivo
      </label>
      <div class="flex items-center gap-3">
        <button (click)="save(s)" [disabled]="savingId() === s.id"
          class="rounded-pill bg-ink text-cream text-sm px-4 py-2 disabled:opacity-60">
          {{ savingId() === s.id ? 'Guardando...' : 'Guardar' }}
        </button>
        @if (savedId() === s.id) {
          <span class="text-xs text-terracotta font-medium">Guardado ✓</span>
        }
        @if (errorById().get(s.id)) {
          <span class="text-xs text-terracotta">{{ errorById().get(s.id) }}</span>
        }
      </div>
    </div>
  }
</div>
