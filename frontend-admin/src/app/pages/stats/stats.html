<div class="flex flex-wrap items-end justify-between gap-4 mb-7">
  <div class="flex flex-col gap-1">
    <h1 class="text-[56px] leading-[0.95] m-0">Estadísticas</h1>
    <span class="text-[15px] text-muted">Visitas y acciones en micasachurch.co, desde Google Analytics</span>
  </div>
  <a [href]="appUrl" target="_blank" rel="noopener"
    class="rounded-[10px] border border-ink/25 px-[18px] py-3 font-bold text-xs tracking-[0.1em] uppercase hover:border-ink">Abrir Google Analytics</a>
</div>

@if (reportUrl) {
  <iframe data-testid="stats-report" [src]="reportUrl" title="Informe de estadísticas del sitio"
    class="panel-card block w-full h-[calc(100vh-220px)] min-h-[600px] border-0" allowfullscreen
    sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
} @else {
  <div class="panel-card p-[22px]">
    <p class="m-0 text-[15px] text-muted">Las estadísticas no están disponibles en este momento.</p>
  </div>
}
