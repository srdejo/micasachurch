<div class="bg-secondary text-tertiary min-h-screen">
  <header class="sticky top-0 z-40 bg-secondary/92 backdrop-blur border-b border-tertiary/15">
    <div class="mx-auto max-w-5xl px-6 py-3.5 flex items-center justify-between">
      <a routerLink="/" class="flex items-center" aria-label="Mi Casa Church — inicio">
        <img src="img/brand/logo-horizontal-light.png" alt="Mi Casa Church" width="600" height="213" class="h-9 w-auto block" />
      </a>
      <a routerLink="/" [fragment]="'visitar'"
        class="rounded-pill border border-tertiary/30 hover:border-tertiary text-sm font-bold px-4 py-2 transition-colors max-[520px]:hidden">
        Planea tu visita
      </a>
    </div>
  </header>

  <div class="mx-auto max-w-5xl px-6 py-14 grid md:grid-cols-[280px_1fr] gap-14">
    <aside class="flex flex-col gap-6 md:sticky md:top-24 self-start">
      <a routerLink="/" class="inline-flex items-center gap-2 self-start text-sm font-bold text-tertiary hover:text-primary">
        <span aria-hidden="true">←</span> Volver al inicio
      </a>
      <div>
        <p class="uppercase tracking-widest text-xs text-primary font-bold mb-2">Devocional diario</p>
        <h1 class="text-[52px] leading-[0.95] m-0">Nuestro Pan Diario</h1>
      </div>

      <div class="flex items-center gap-2">
        <button (click)="goToDate(-1)" title="Día anterior"
          class="h-10 w-10 rounded-full border border-tertiary/20 hover:bg-tertiary/10 text-lg">‹</button>
        <input type="date" [value]="isoDate()" (change)="onDatePicked($any($event.target).value)"
          class="flex-1 min-w-0 rounded-lg border border-tertiary/20 bg-tertiary/[0.06] px-3 py-2 text-sm" style="color-scheme: dark;" />
        <button (click)="goToDate(1)" title="Día siguiente"
          class="h-10 w-10 rounded-full border border-tertiary/20 hover:bg-tertiary/10 text-lg">›</button>
      </div>

      <div class="flex items-center gap-2 text-sm">
        <span class="uppercase tracking-wide text-xs text-tertiary/55 flex-1">Tamaño de texto</span>
        <button (click)="decreaseFont()" class="h-9 w-9 rounded-lg border border-tertiary/20 hover:bg-tertiary/10 font-bold text-xs">A−</button>
        <button (click)="increaseFont()" class="h-9 w-9 rounded-lg border border-tertiary/20 hover:bg-tertiary/10 font-bold">A+</button>
      </div>

      <button (click)="share()"
        class="rounded-pill bg-primary hover:bg-primary-hover text-secondary font-bold text-sm py-3 transition-colors">
        {{ shared() ? 'Enlace copiado' : 'Compartir devocional' }}
      </button>
    </aside>

    <main class="min-h-[60vh] capitalize-first">
      <p class="text-xs uppercase tracking-widest text-tertiary/55 mb-6 capitalize">{{ formattedDate() }}</p>
      <app-devotional-article [entry]="entry()" [loading]="loading()" [error]="error()" [fontScale]="fontScale()"
        (retry)="retry()" />
    </main>
  </div>

  <footer class="border-t border-tertiary/15 py-8">
    <div class="mx-auto max-w-5xl px-6 flex flex-wrap items-center justify-between gap-3 text-sm text-tertiary/55">
      <span>Mi Casa Church · Ocaña, Colombia</span>
      <span>Devocional cortesía de Nuestro Pan Diario (Our Daily Bread Ministries)</span>
    </div>
  </footer>
</div>
