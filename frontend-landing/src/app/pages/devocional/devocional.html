<div class="bg-ink text-paper min-h-screen">
  <header class="sticky top-0 z-40 bg-ink/92 backdrop-blur border-b border-paper/15">
    <div class="mx-auto max-w-5xl px-6 py-3.5 flex items-center justify-between">
      <a routerLink="/" class="flex items-center gap-[9px]" aria-label="Mi Casa Church — inicio">
        <span class="logo-mark w-10 h-[34px]" aria-hidden="true"></span>
        <img src="img/brand/logo-text-white.png" alt="Mi Casa Church" width="291" height="128" class="h-8 w-auto block" />
      </a>
      <a routerLink="/" [fragment]="'visitar'"
        class="rounded-full border border-paper/30 hover:border-paper text-sm font-bold px-4 py-2 transition-colors max-[520px]:hidden">
        Planea tu visita
      </a>
    </div>
  </header>

  <div class="mx-auto max-w-5xl px-6 py-14 grid md:grid-cols-[280px_1fr] gap-14">
    <aside class="flex flex-col gap-6 md:sticky md:top-24 self-start">
      <a routerLink="/" class="inline-flex items-center gap-2 self-start text-sm font-bold text-paper hover:text-accent">
        <span aria-hidden="true">←</span> Volver al inicio
      </a>
      <div>
        <p class="uppercase tracking-widest text-xs text-accent font-bold mb-2">Devocional diario</p>
        <h1 class="font-black text-[64px] leading-[0.9] m-0">Nuestro Pan Diario</h1>
      </div>

      <div class="flex items-center gap-2">
        <button (click)="goToDate(-1)" title="Día anterior"
          class="h-10 w-10 rounded-full border border-paper/20 hover:bg-paper/10 text-lg">‹</button>
        <input type="date" [value]="isoDate()" (change)="onDatePicked($any($event.target).value)"
          class="flex-1 min-w-0 rounded-lg border border-paper/20 bg-paper/[0.06] px-3 py-2 text-sm" style="color-scheme: dark;" />
        <button (click)="goToDate(1)" title="Día siguiente"
          class="h-10 w-10 rounded-full border border-paper/20 hover:bg-paper/10 text-lg">›</button>
      </div>

      <div class="flex items-center gap-2 text-sm">
        <span class="uppercase tracking-wide text-xs text-paper/55 flex-1">Tamaño de texto</span>
        <button (click)="decreaseFont()" class="h-9 w-9 rounded-lg border border-paper/20 hover:bg-paper/10 font-bold text-xs">A−</button>
        <button (click)="increaseFont()" class="h-9 w-9 rounded-lg border border-paper/20 hover:bg-paper/10 font-bold">A+</button>
      </div>

      <button (click)="share()"
        class="rounded-full bg-accent hover:bg-paper text-ink font-bold text-sm py-3 transition-colors">
        {{ shared() ? 'Enlace copiado' : 'Compartir devocional' }}
      </button>
    </aside>

    <main class="min-h-[60vh] capitalize-first">
      <p class="text-xs uppercase tracking-widest text-paper/55 mb-6 capitalize">{{ formattedDate() }}</p>
      <app-devotional-article [entry]="entry()" [loading]="loading()" [error]="error()" [fontScale]="fontScale()"
        (retry)="retry()" />
    </main>
  </div>

  <footer class="border-t border-paper/15 py-8">
    <div class="mx-auto max-w-5xl px-6 flex flex-wrap items-center justify-between gap-3 text-sm text-paper/55">
      <span>Mi Casa Church · Ocaña, Colombia</span>
      <span>Devocional cortesía de Nuestro Pan Diario (Our Daily Bread Ministries)</span>
    </div>
  </footer>
</div>
