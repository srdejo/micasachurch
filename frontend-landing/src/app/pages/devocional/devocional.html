<div class="bg-ink text-cream min-h-screen">
  <header class="sticky top-0 z-40 bg-ink/92 backdrop-blur border-b border-cream/15">
    <div class="mx-auto max-w-5xl px-6 py-3.5 flex items-center justify-between">
      <a routerLink="/" class="flex items-center gap-3">
        @if (!logoImageFailed()) {
          <img [src]="imageUrl('logo')" (error)="logoImageFailed.set(true)" alt="Mi Casa Church"
            class="h-9 w-9 rounded-full object-cover" />
        } @else {
          <span class="h-9 w-9 rounded-full bg-terracotta text-cream flex items-center justify-center font-serif">M</span>
        }
        <span class="font-serif text-lg">Mi Casa Church</span>
      </a>
      <a routerLink="/" [fragment]="'visitar'"
        class="rounded-pill border border-cream/30 hover:border-cream text-sm px-4 py-2 transition-colors">
        Planea tu visita
      </a>
    </div>
  </header>

  <div class="mx-auto max-w-5xl px-6 py-14 grid md:grid-cols-[280px_1fr] gap-14">
    <aside class="flex flex-col gap-6 md:sticky md:top-24 self-start">
      <div>
        <p class="uppercase tracking-widest text-xs text-gold font-semibold mb-2">Devocional diario</p>
        <h1 class="font-serif text-3xl leading-tight">Nuestro Pan Diario</h1>
      </div>

      <div class="flex items-center gap-2">
        <button (click)="goToDate(-1)" title="Día anterior"
          class="h-10 w-10 rounded-full border border-cream/20 hover:bg-cream/10 text-lg">‹</button>
        <input type="date" [value]="isoDate()" (change)="onDatePicked($any($event.target).value)"
          class="flex-1 min-w-0 rounded-lg border border-cream/20 bg-cream/[0.06] px-3 py-2 text-sm" style="color-scheme: dark;" />
        <button (click)="goToDate(1)" title="Día siguiente"
          class="h-10 w-10 rounded-full border border-cream/20 hover:bg-cream/10 text-lg">›</button>
      </div>

      <div class="flex items-center gap-2 text-sm">
        <span class="uppercase tracking-wide text-xs text-cream/55 flex-1">Tamaño de texto</span>
        <button (click)="decreaseFont()" class="h-9 w-9 rounded-lg border border-cream/20 hover:bg-cream/10 font-bold text-xs">A−</button>
        <button (click)="increaseFont()" class="h-9 w-9 rounded-lg border border-cream/20 hover:bg-cream/10 font-bold">A+</button>
      </div>

      <button (click)="share()"
        class="rounded-pill bg-terracotta hover:bg-terracotta-hover text-cream font-semibold text-sm py-3 transition-colors">
        {{ shared() ? 'Enlace copiado' : 'Compartir devocional' }}
      </button>
    </aside>

    <main class="min-h-[60vh] capitalize-first">
      <p class="text-xs uppercase tracking-widest text-cream/55 mb-6 capitalize">{{ formattedDate() }}</p>
      <app-devotional-article [entry]="entry()" [loading]="loading()" [error]="error()" [fontScale]="fontScale()"
        (retry)="retry()" />
    </main>
  </div>

  <footer class="border-t border-cream/15 py-8">
    <div class="mx-auto max-w-5xl px-6 flex flex-wrap items-center justify-between gap-3 text-sm text-cream/55">
      <span>Mi Casa Church · Ocaña, Colombia</span>
      <span>Devocional cortesía de Nuestro Pan Diario (Our Daily Bread Ministries)</span>
    </div>
  </footer>
</div>
