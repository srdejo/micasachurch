# NOTA (2026-09-01): en el VPS real, Certbot reescribió este archivo con los
# bloques 443 ssl. Se ajustó ahí mismo para que www.micasachurch.co haga 301 a
# micasachurch.co (dominio canónico) en vez de servir el mismo contenido en
# ambos hosts — el backend solo permite ese origen en CORS_ALLOWED_ORIGIN, y
# servir el sitio también en www causaba que todo POST/PUT (ej. peticiones de
# oración) fallara ahí por CORS. Este archivo queda como plantilla base para
# un reaprovisionamiento; replicar el redirect www→apex si se recrea desde cero.
server {
    listen 80;
    server_name micasachurch.co www.micasachurch.co;
    root /home/srdejo/apps/micasachurch/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
